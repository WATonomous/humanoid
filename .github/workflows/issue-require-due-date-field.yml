name: Issue Requires Due Date Field

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  check:
    name: Ensure issue body has a Due date field
    runs-on: ubuntu-latest
    steps:
      - name: Check for "### Due date" section
        uses: actions/github-script@v7
        with:
          script: |
            const DUE_DATE_HEADER_RE = /###\s*Due date/i;
            const MISSING_LABEL = 'missing-due-date-field';
            const MARKER = '<!-- missing-due-date-field-notice -->';

            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const hasField = DUE_DATE_HEADER_RE.test(issue.body || '');

            const labels = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
            const hasLabel = labels.includes(MISSING_LABEL);

            if (hasField) {
              if (hasLabel) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: MISSING_LABEL,
                });
              }
              return;
            }

            if (!hasLabel) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: [MISSING_LABEL],
              });
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const alreadyNoted = comments.some(c => c.body && c.body.includes(MARKER));
            if (alreadyNoted) return;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body:
                `This issue is missing a **Due date** field (a \`### Due date\` section in the body). ` +
                `It can be left empty, but the field must be present for the deadline-reminder bot to recognize it later.\n\n` +
                `Please add:\n\n\`\`\`\n### Due date\n\nYYYY-MM-DD\n\`\`\`\n\n(or leave the date blank / use the "Task (with deadline)" issue template.)\n\n${MARKER}`,
            });
