name: Pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  run-pre-commit:
    name: Pre-commit Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pre-commit
      - run: pre-commit run --all-files
