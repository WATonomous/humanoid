# Isaac Sim keyboard teleop, Pioneer v1 left arm. Physics 100 Hz; recorded every 4th step.
robot_id: pioneer_v1_left_arm_sim
repo_id: humanoid/pioneer_v1_left_arm_sim
fps: 25
state_unit: rad (arm joints), 0-1 closure fraction (gripper)

# Real-robot names (joint_command_core.cpp); sim joint in comment.
joint_names:
  - left_shoulder_pitch  # joint1L
  - left_shoulder_roll   # joint2l
  - left_shoulder_yaw    # joint3l
  - left_elbow_pitch     # joint4l
  - left_elbow_roll      # joint5l
  - left_wrist_pitch     # joint6l
  - left_gripper         # joint7l/joint8l: 0 = open, 1 = closed

# Cameras: teleop_cameras.make_record_cam_cfg. `enabled` is the default; override with --cameras.
images:
  ego:
    height: 256
    width: 256
    enabled: true
  wrist_left:
    height: 256
    width: 256
    enabled: true
  wrist_right:  # not on the real arm yet
    height: 256
    width: 256
    enabled: false

record:
  root: datasets/pioneer_v1_left_arm_sim
  use_videos: true
  image_writer_threads: 4
  image_writer_processes: 0
