# Isaac Sim keyboard teleop — bimanual left arm pick & place demonstration dataset schema
robot_id: pioneer_bimanual_left_sim_v1
repo_id: humanoid/local_left_arm_sim
fps: 30
state_unit: rad

joint_names:
  - joint1L
  - joint2l
  - joint3l
  - joint4l
  - joint5l
  - joint6l
  - joint7l
  - joint8l

images:
  ego_cam:
    height: 480
    width: 640
    enabled: true
  wrist_cam:
    height: 480
    width: 640
    enabled: true

record:
  root: datasets/record_sim
  use_videos: true
  image_writer_threads: 4
  image_writer_processes: 0
