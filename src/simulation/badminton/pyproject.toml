[project]
name = "humanoid-badminton"
version = "0.1.0"
description = "Badminton receive environment: shuttle aero, MuJoCo scene, inverse launcher, interception predictor, scripted baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "trimesh>=4.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# GPU training runs through mjlab (MuJoCo Warp): train = NVIDIA (CUDA torch
# wheels; training needs Linux + an NVIDIA GPU), train-cpu = CPU torch so the
# task code can be smoke-tested on any machine (MuJoCo Warp runs on CPU but
# is far too slow to train on). Everything else in the project is the local
# CPU mode on plain MuJoCo.
# wandb 0.29 removed Settings(start_method=...), which rsl_rl 5.4.2's wandb
# writer still passes; there is no lock file, so pin it here
train = ["mjlab[cu128]==1.6.0", "wandb<0.29"]
train-cpu = ["mjlab[cpu]==1.6.0", "wandb<0.29"]

[tool.uv]
package = false
# the two train extras pull torch from different wheel indexes (mjlab's
# cu128/cpu extras); never install both
conflicts = [[{ extra = "train" }, { extra = "train-cpu" }]]
