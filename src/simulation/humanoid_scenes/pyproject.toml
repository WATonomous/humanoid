[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-scenes"
version = "0.1.0"
description = "Manipulation scenes for pioneer-arm teleop data collection (one folder per scene, auto-discovered)"
requires-python = ">=3.11"
# isaaclab / isaacsim come from the isaac_lab image.
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["humanoid_scenes*"]
