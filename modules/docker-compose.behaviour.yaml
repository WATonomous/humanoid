services:
  voxel_grid:
    build:
      context: ..
      dockerfile: docker/behaviour/voxel_grid/voxel_grid.Dockerfile
      target: develop
      args:
        USER_UID: "${USER_UID}"
        USER_GID: "${USER_GID}"
        USERNAME: "${USERNAME}"
        BASE_IMAGE: ${BASE_IMAGE_OVERRIDE-}
      cache_from:
        - "${BEHAVIOUR_VOXEL_IMAGE:?}:${TAG}"
        - "${BEHAVIOUR_VOXEL_IMAGE:?}:main"
    image: "${BEHAVIOUR_VOXEL_IMAGE:?}:${TAG}"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    working_dir: /root/ament_ws
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    volumes:
      - ${MONO_DIR}/src/behaviour/voxel_grid:/root/ament_ws/src/voxel_grid
    command: tail -F anything

  joint_command:
    build:
      context: ..
      dockerfile: docker/behaviour/joint_command/joint_command.Dockerfile
      target: develop
      args:
        USER_UID: "${USER_UID}"
        USER_GID: "${USER_GID}"
        USERNAME: "${USERNAME}"
        BASE_IMAGE: ${BASE_IMAGE_OVERRIDE-}
      cache_from:
        - "${BEHAVIOUR_JOINT_COMMAND_IMAGE:?}:${TAG}"
        - "${BEHAVIOUR_JOINT_COMMAND_IMAGE:?}:main"
    image: "${BEHAVIOUR_JOINT_COMMAND_IMAGE:?}:${TAG}"
    network_mode: host
    working_dir: /root/ament_ws
    # editable src is bind-mounted; launch it yourself:
    #   watod -t joint_command  ->  ros2 launch joint_command joint_command.launch.py
    command: tail -F anything
    volumes:
      - ${MONO_DIR}/src/behaviour/joint_command:/root/ament_ws/src/joint_command
