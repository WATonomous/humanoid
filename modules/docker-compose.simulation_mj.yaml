services:
  simulation_mj:
    build:
      context: ..
      dockerfile: docker/simulation/mjlabs/mjlabs.Dockerfile
      target: develop
      args:
        USER_UID: "${USER_UID}"
        USER_GID: "${USER_GID}"
        USERNAME: "${USERNAME}"
      cache_from:
        - "${SIMULATION_MJ_IMAGE:?}:${TAG}"
        - "${SIMULATION_MJ_IMAGE:?}:main"
    image: "${SIMULATION_MJ_IMAGE:?}:${TAG}"
    network_mode: "bridge"
    ipc: "none"
    ports:
      - "8080:8080"
    environment:
      #commented the two below since I (Nitish) don't have a GPU and can't test them. Uncomment if you have a GPU and want to use it.
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - ROS_DOMAIN_ID=0
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      #added the below three for mujoco visualization
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=/tmp/runtime-nitish
    command: sleep infinity
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      - ${MONO_DIR}/src/simulation:/root/ament_ws/src/simulation
      - ${MONO_DIR}/src/teleop:/root/ament_ws/src/teleop
      - ${MONO_DIR}/src/common_msgs:/root/ament_ws/src/common_msgs
      - ${MONO_DIR}/src/interfacing/joint_command:/root/ament_ws/src/joint_command
      #so that the models folder is mounted into mjlabs docker container
      - ${MONO_DIR}/models:/root/ament_ws/models:ro
      ##added the three below for mujoco visualization
      - ${MONO_DIR}/assets:/root/ament_ws/assets:ro
      - ${XDG_RUNTIME_DIR}/wayland-0:/tmp/runtime-nitish/wayland-0
      - /tmp/.X11-unix:/tmp/.X11-unix