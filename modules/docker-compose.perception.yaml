services:
  perception:
    build:
      context: ..
      dockerfile: docker/perception/perception.Dockerfile
      cache_from:
        - "${PERCEPTION_IMAGE:?}:${TAG}"
        - "${PERCEPTION_IMAGE:?}:main"
      args:
        BASE_IMAGE: ${BASE_IMAGE_OVERRIDE-}
    image: "${PERCEPTION_IMAGE:?}:${TAG}"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ${MONO_DIR}/src/perception:/root/ament_ws/src/perception
    command: /bin/bash -c "ros2 launch perception perception.launch.py"
